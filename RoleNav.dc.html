<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bottom bar — by role</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="./cc.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B2A8C}a:hover{color:#4A1F73}
</style>
</helmet>
<!-- One bottom bar, shaped by the account's roles and Crew modes. Job Seeker only: Listings is labelled Rent/Buy. Crew or Both: Home · Jobs · More (Calendar, Invoices) · Listings · Profile.
     Vendor only: Home · Listings · Invoices · Network · Profile (no Jobs, no Calendar, so no More dock). -->
<div style="width: 390px; height: 96px; position: relative; display: flex; flex-direction: column; justify-content: flex-end; font-family: Inter, system-ui, sans-serif">
  <sc-if value="{{isCrew}}" hint-placeholder-val="{{ true }}">
  <nav class="nav" aria-label="Main" style="{{navStyle}}">
    <a class="{{c_home}}" href="SeekerHome.dc.html" aria-current="{{a_home}}"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path></svg></span>Home</a>
    <a class="{{c_jobs}}" href="Jobs.dc.html" aria-current="{{a_jobs}}"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"></path></svg></span>Jobs</a>
    <sc-if value="{{hasDock}}" hint-placeholder-val="{{ true }}"><div class="{{nmCls}}"><label class="nm-btn"><input type="checkbox" class="nm-t" aria-label="More: Calendar and Invoices"><span class="nm-scrim" aria-hidden="true"></span><span class="nm-core"><svg class="i nm-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="2"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"></rect></svg></span><span class="nm-lbl">More</span></label><div class="nm-menu"><span class="nm-arc" aria-hidden="true"></span><a class="{{calCls}}" href="Calendar.dc.html"><span class="nm-orb"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg></span><span class="nm-tag">Calendar</span></a><a class="{{invCls}}" href="Invoices.dc.html"><span class="nm-orb"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg></span><span class="nm-tag">Invoices</span></a></div></div></sc-if><sc-if value="{{noDock}}" hint-placeholder-val="{{ false }}"><a class="{{c_invoices}}" href="Invoices.dc.html" aria-current="{{a_invoices}}"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg></span>Invoices</a></sc-if>
    <sc-if value="{{rentBuy}}" hint-placeholder-val="{{ false }}"><a class="{{c_listings}}" href="MyListings.dc.html" aria-current="{{a_listings}}" aria-label="Rent or buy equipment"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg></span>Rent/Buy</a></sc-if><sc-if value="{{notRentBuy}}" hint-placeholder-val="{{ true }}"><a class="{{c_listings}}" href="MyListings.dc.html" aria-current="{{a_listings}}"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"></path><path d="M3 7.5 12 12l9-4.5M12 12v9"></path></svg></span>Listings</a></sc-if>
    <a class="{{c_profile}}" href="SeekerProfile.dc.html" aria-current="{{a_profile}}"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>Profile</a>
  </nav>
  </sc-if>
  <sc-if value="{{isVendor}}" hint-placeholder-val="{{ false }}">
  <nav class="nav" aria-label="Main" style="{{navStyle}}">
    <a class="{{c_home}}" href="SeekerHome.dc.html" aria-current="{{a_home}}"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path></svg></span>Home</a>
    <a class="{{c_listings}}" href="MyListings.dc.html" aria-current="{{a_listings}}"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"></path><path d="M3 7.5 12 12l9-4.5M12 12v9"></path></svg></span>Listings</a>
    <a class="{{c_invoices}}" href="Invoices.dc.html" aria-current="{{a_invoices}}"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg></span>Invoices</a>
    <a class="{{c_network}}" href="DiscoverFeed.dc.html" aria-current="{{a_network}}"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m15.5 8.5-2 5-5 2 2-5z"></path></svg></span>Network</a>
    <a class="{{c_profile}}" href="SeekerProfile.dc.html" aria-current="{{a_profile}}"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>Profile</a>
  </nav>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"roles":{"editor":null},"modes":{"editor":null},"active":{"editor":"enum","options":["home","jobs","listings","calendar","invoices","network","profile",""],"default":"home"},"tall":{"editor":"boolean","default":false},"$preview":{"width":390,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    const R = this.props.roles || { crew: true, vendor: true };
    const a = this.props.active ?? 'home';
    const md = this.props.modes || { seek: true, post: true };
    const vendorOnly = !!R.vendor && !R.crew;
    const c = (k) => (a === k ? 'on' : '');
    const more = a === 'calendar' || a === 'invoices';
    return {
      // Calendar belongs to Job Seeker. Without it only Invoices is left, so the dock becomes a direct tab.
      // Availability calendar is for all Crew Members (client decision), so every Crew bar keeps the More dock.
      hasDock: !vendorOnly, noDock: false,
      // Job Seeker only (no Job Poster, no Vendor role): the Listings tab is called Rent/Buy.
      rentBuy: !!R.crew && !R.vendor && md.seek !== false && md.post === false, notRentBuy: !(!!R.crew && !R.vendor && md.seek !== false && md.post === false),
      isCrew: !vendorOnly, isVendor: vendorOnly,
      navStyle: this.props.tall ? 'height:96px;padding-bottom:34px' : '',
      c_home: c('home'), c_jobs: c('jobs'), c_listings: c('listings'), c_profile: c('profile'), c_invoices: c('invoices'), c_network: c('network'),
      a_home: a === 'home' ? 'page' : 'false', a_jobs: a === 'jobs' ? 'page' : 'false', a_listings: a === 'listings' ? 'page' : 'false', a_profile: a === 'profile' ? 'page' : 'false', a_invoices: a === 'invoices' ? 'page' : 'false', a_network: a === 'network' ? 'page' : 'false',
      nmCls: more ? 'nm on' : 'nm',
      calCls: 'nm-opt nm-o1' + (a === 'calendar' ? ' on' : ''),
      invCls: 'nm-opt nm-o2' + (a === 'invoices' ? ' on' : '')
    };
  }
}
</script>
</body>
</html>
