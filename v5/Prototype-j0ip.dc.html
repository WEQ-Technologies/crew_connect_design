a{color:#7C3AED}a:hover{color:#6527C8}
/* Device viewport: the app runs edge to edge on the whole 390×891 screen, like an installed app.
   Backgrounds extend under the status bar, Dynamic Island and home indicator; content keeps iOS safe areas
   (47px top, 34px bottom). Only the prototype frame applies this — the standalone 390×844 artboards are unchanged. */
.pv-app .ph{height:891px;padding-top:47px;box-sizing:border-box}
.pv-app .nav{height:96px;padding-bottom:34px}
.pv-app .foot{padding-bottom:34px}
/* Full-screen Filters page: keep its header below the status bar / Dynamic Island and its footer above the home indicator. */
.pv-app .fp-root{padding-top:47px;box-sizing:border-box}
.pv-app .fp-foot{padding-bottom:40px}
.pv-app .fab{bottom:112px!important}
.pv-app [role="menu"][aria-label="Create"]{bottom:180px!important}
/* Role-aware shell: on tab screens the prototype draws ONE bottom bar shaped by the account's roles (RoleNav).
   The screen's own bar keeps its space but is hidden, so layouts do not shift. */
.pv-shell .ph nav.nav{visibility:hidden!important}
.pv-coach{position:absolute;left:16px;right:16px;bottom:108px;z-index:40;padding:14px 16px;border-radius:18px;background:rgba(22,48,32,.92);color:#fff;box-shadow:0 18px 40px -12px rgba(22,48,32,.55);font-family:Inter,system-ui,sans-serif;animation:pvCoach .45s cubic-bezier(.2,.9,.3,1.2) both}
.pv-coach:after{content:'';position:absolute;bottom:-7px;width:14px;height:14px;background:rgba(22,48,32,.92);transform:rotate(45deg);left:var(--ca,50%);margin-left:-7px;border-radius:2px}
.pv-coach button{margin-top:10px;border:0;border-radius:10px;padding:8px 14px;background:#fff;color:#6527C8;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
@keyframes pvCoach{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pv-coach{animation:none}}
/* Full-screen overlays (Filters page, sheets, dialogs) on the visible screen sit above the shared bottom bar: hide the bar while one is open. */
.pv-app:has([style*="display:block"] .fp-root, [style*="display: block"] .fp-root, [style*="display:block"] .scrim, [style*="display: block"] .scrim) .pv-navwrap{display:none}
@keyframes pvFwd{from{transform:translateX(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes pvBack{from{transform:translateX(-12px);opacity:0}to{transform:none;opacity:1}}
@keyframes pvFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){[style*='pvFwd'],[style*='pvBack'],[style*='pvFade']{animation:none!important}}
</style>
