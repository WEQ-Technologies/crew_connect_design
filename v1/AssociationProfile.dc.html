<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Association profile</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="./cc.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B2A8C}a:hover{color:#4A1F73}
</style>
</helmet>
<div class="ph">
  <div class="bar"><a class="iconbtn" href="ForumWall.dc.html" aria-label="Back to notices"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><div class="ttl">Association</div></div>
  <div class="sc" style="gap: 16px">
    <div class="card" style="align-items: center; text-align: center; padding: 22px 18px; gap: 10px">
      <span style="{{logo}}" role="img" aria-label="{{name}} logo">{{key}}</span>
      <div class="t-h1">{{name}}</div>
      <div class="chips" style="justify-content: center">
        <sc-if value="{{active}}" hint-placeholder-val="{{ true }}"><span class="badge b-g"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle></svg>Active</span></sc-if>
        <sc-if value="{{inactive}}" hint-placeholder-val="{{ false }}"><span class="badge b-n"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg>Inactive</span></sc-if>
        <sc-if value="{{hasRegion}}" hint-placeholder-val="{{ true }}"><span class="badge b-n"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>{{region}}</span></sc-if>
      </div>
      <sc-if value="{{hasAbout}}" hint-placeholder-val="{{ true }}"><p class="t-s mut">{{about}}</p></sc-if>
    </div>
    <sc-if value="{{inactive}}" hint-placeholder-val="{{ false }}">
      <div class="alert a-i"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 7.5v.01"></path></svg><div>This association is currently inactive and isn't publishing new notices. Earlier notices remain visible <span class="ph-tag">[TBC]</span>.</div></div>
    </sc-if>
    <div class="sec"><h2>Notices · {{n}}</h2><span class="t-c mut">Newest first</span></div>
    <div class="list">
      <sc-for list="{{notices}}" as="t" hint-placeholder-count="3">
        <a class="li" href="NoticeDetail.dc.html" style="align-items: flex-start"><div class="sp"><div class="t-h3">{{t.title}}</div><div class="row t-c mut" style="gap: 8px; margin-top: 4px">{{t.date}}<sc-if value="{{t.pdf}}" hint-placeholder-val="{{ false }}"><span class="tag" style="min-height: 22px">PDF</span></sc-if><sc-if value="{{t.isNew}}" hint-placeholder-val="{{ false }}"><span class="badge b-g" style="height: 22px">New</span></sc-if></div></div><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #6B6676; margin-top: 2px"><path d="m9 18 6-6-6-6"></path></svg></a>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"store":{"editor":null},"status":{"editor":"enum","options":["active","inactive"],"default":"active"},"assoc":{"editor":"enum","options":["CTG","WLA","SSP","IPC"],"default":"CTG"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.A = {
      CTG: { name: 'Cine Technicians Guild of Maharashtra', short: 'Cine Technicians Guild', bg: '#EFE7F7', fg: '#4A1F73' },
      WLA: { name: 'Western India Film Lighting Association', short: 'Film Lighting Assn.', bg: '#E6F2DC', fg: '#2C6619' },
      SSP: { name: 'Screen Sound Professionals Forum', short: 'Screen Sound Forum', bg: '#FFF2DB', fg: '#8A5300' },
      IPC: { name: 'Independent Producers Council', short: 'Producers Council', bg: '#F2F0F5', fg: '#1A1820' }
    };
    this.data = [
      { a: 'CTG', date: '27 Oct 2026', title: 'Revised minimum day rates for camera and lighting crew — effective 1 December', preview: 'Following the general body meeting on 20 October, the revised minimum day rates for camera assistants, focus pullers and lighting technicians are published below. Members should quote these rates on all new engagements.', pdf: true },
      { a: 'WLA', date: '25 Oct 2026', title: 'Mandatory electrical safety refresher — November batches open', preview: 'All member gaffers and best boys working on sets above 50 kW must complete the annual safety refresher. Four batches will run at Goregaon in November.', pdf: true },
      { a: 'SSP', date: '22 Oct 2026', title: 'Wireless frequency guidance for outdoor shoots in Mumbai', preview: 'Members have reported interference near Film City during evening schedules. We recommend the frequency plan in the attached note until further notice.', pdf: false },
      { a: 'CTG', date: '18 Oct 2026', title: 'Office closed for Diwali, 7–10 November', preview: 'The Guild office and helpline will be closed from 7 to 10 November. Emergency on-set grievances can still be raised by email.', pdf: false },
      { a: 'WLA', date: '12 Oct 2026', title: 'New member registration window: 1–30 November', preview: 'Applications for new members open on 1 November. Bring two references from existing members and proof of three credits.', pdf: true }
    ];
    this.extra = { CTG: [{ a: 'CTG', date: '1 Oct 2026', title: 'Annual general body meeting — 20 October', pdf: true }] };
    this.info = { CTG: { region: 'Maharashtra', about: 'A registered body representing camera, lighting and grip technicians working in film, television and advertising across Maharashtra.' } };
  }
  renderVals() {
    const st = this.props.status ?? 'active';
    const key = this.A[this.props.assoc] ? this.props.assoc : 'CTG';
    const A = this.A[key], I = this.info[key] || {};
    const mine = ((this.props.store && this.props.store.posts) || []).map((n) => ({ ...n, isNew: true })).concat(this.data, this.extra[key] || []).filter((n) => n.a === key);
    return {
      key, name: A.name, region: I.region || '', hasRegion: !!I.region, about: I.about || '', hasAbout: !!I.about,
      logo: 'width:72px;height:72px;border-radius:20px;border:1px solid #E8E5EE;display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;background:' + A.bg + ';color:' + A.fg,
      notices: mine.map((n) => ({ title: n.title, date: n.date, pdf: !!n.pdf, isNew: !!n.isNew })), n: mine.length,
      active: st === 'active', inactive: st !== 'active'
    };
  }
}
</script>
</body>
</html>
