<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My jobs</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="./cc.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B2A8C}a:hover{color:#4A1F73}
</style>
</helmet>
<div class="ph">
  <div class="bar"><div class="ttl" style="padding-left: 12px; font-size: 20px">My jobs</div></div>
  <div style="flex: none; padding: 4px 20px 12px; display: flex; flex-direction: column; gap: 12px">
    <div class="srch"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input placeholder="Search your jobs" value="{{q}}" onChange="{{onQ}}" aria-label="Search your jobs"></div>
    <div class="chips x">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button class="{{t.cls}}" onClick="{{t.pick}}" aria-pressed="{{t.on}}">{{t.label}}</button></sc-for>
    </div>
  </div>
  <div class="sc" style="padding-top: 0; gap: 12px; padding-bottom: 96px">
    <div class="t-s mut" role="status"><b style="color: #1D1B22">{{count}}</b> {{countWord}}</div>
    <sc-for list="{{jobs}}" as="j" hint-placeholder-count="4">
      <div class="card">
        <div class="row" style="align-items: flex-start; gap: 10px">
          <a href="PosterJobDetail.dc.html" class="sp" style="color: #1D1B22; text-decoration: none"><div class="t-h3 clamp2">{{j.title}}</div><div class="t-c mut" style="margin-top: 4px">{{j.cat}} · {{j.loc}}</div></a>
          <sc-if value="{{j.pub}}" hint-placeholder-val="{{ true }}"><span class="badge b-g"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle></svg>Published</span></sc-if>
          <sc-if value="{{j.draft}}" hint-placeholder-val="{{ false }}"><span class="badge b-n"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>Draft</span></sc-if>
        </div>
        <div class="row t-c mut" style="gap: 14px"><span class="row" style="gap: 5px"><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{j.when}}</span><span class="row" style="gap: 5px"><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path></svg>{{j.apps}}</span></div>
        <div class="hr"></div>
        <div class="row" style="gap: 8px">
          <a class="btn btn-s btn-sm" href="CreateJob.dc.html" style="flex: 1"><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>Edit</a>
          <sc-if value="{{j.pub}}" hint-placeholder-val="{{ true }}"><a class="btn btn-p btn-sm" href="Applicants.dc.html" style="flex: 1.4">View applicants</a></sc-if>
          <sc-if value="{{j.draft}}" hint-placeholder-val="{{ false }}"><a class="btn btn-p btn-sm" href="CreateJob.dc.html" style="flex: 1.4">Review &amp; publish</a></sc-if>
        </div>
      </div>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div class="empty"><div class="ring"><svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"></path></svg></div><div class="t-h2">No jobs found</div><div class="t-s mut">Try another search, or post a new job.</div><a class="btn btn-p" href="CreateJob.dc.html">Post a Job</a></div>
    </sc-if>
  </div>

  <a class="fab" href="CreateJob.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add job</a>

  <nav class="nav" aria-label="Main">
    <a href="PosterHome.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path></svg></span>Home</a>
    <a class="on" href="MyJobs.dc.html" aria-current="page"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"></path></svg></span>My Jobs</a>
    <a href="Applicants.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"></path></svg></span>Applicants</a>
    <a href="Talent.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></span>Find Talent</a>
    <a href="PosterProfile.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1"></rect><path d="M9 7h1M14 7h1M9 11h1M14 11h1M10 21v-3h4v3"></path></svg></span>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.data = [
      { title: 'Focus Puller — Feature Film (Hindi), 32-day schedule', cat: 'Camera', loc: 'Film City, Mumbai', st: 'Published', when: 'Posted 2d ago', apps: '18 applicants' },
      { title: 'Production Designer — Period Drama Pilot', cat: 'Art & Production Design', loc: 'Mumbai', st: 'Published', when: 'Posted 6d ago', apps: '9 applicants' },
      { title: 'Spot Boy / Set Assistant (4 positions)', cat: 'Production', loc: 'Panaji, Goa', st: 'Published', when: 'Posted today', apps: 'No applicants yet' },
      { title: 'Costume Assistant — Feature Film Goa schedule', cat: 'Costume & Make-up', loc: 'Panaji, Goa', st: 'Draft', when: 'Edited yesterday', apps: 'Not published' }
    ];
    this.state = { q: '', tab: 'All' };
  }
  renderVals() {
    const s = this.state, q = s.q.trim().toLowerCase();
    const list = this.data.filter((j) => (s.tab === 'All' || j.st === s.tab) && (!q || (j.title + j.cat + j.loc).toLowerCase().includes(q)));
    const cnt = (t) => (t === 'All' ? this.data.length : this.data.filter((j) => j.st === t).length);
    return {
      q: s.q, onQ: (e) => this.setState({ q: e.target.value }),
      tabs: ['All', 'Published', 'Draft'].map((t) => ({ label: t + ' (' + cnt(t) + ')', on: s.tab === t, cls: s.tab === t ? 'chip on' : 'chip', pick: () => this.setState({ tab: t }) })),
      jobs: list.map((j) => ({ ...j, pub: j.st === 'Published', draft: j.st === 'Draft' })),
      count: list.length, countWord: list.length === 1 ? 'job' : 'jobs', empty: list.length === 0
    };
  }
}
</script>
</body>
</html>
