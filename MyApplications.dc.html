<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My applications</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="./cc.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B2A8C}a:hover{color:#4A1F73}
</style>
</helmet>
<div class="ph">
  <div class="bar"><a class="iconbtn" href="SeekerHome.dc.html" aria-label="Back"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><div class="ttl">My applications</div></div>
  <div style="flex: none; padding: 0 20px 12px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div class="card" style="padding: 10px 12px; gap: 0"><div class="t-h2">{{nAll}}</div><div class="t-c mut">Applied</div></div>
      <div class="card" style="padding: 10px 12px; gap: 0"><div class="t-h2" style="color: #5B2A8C">{{nActive}}</div><div class="t-c mut">In progress</div></div>
      <div class="card" style="padding: 10px 12px; gap: 0"><div class="t-h2" style="color: #2C6619">{{nShort}}</div><div class="t-c mut">Shortlisted</div></div>
    </div>
    <div class="chips x"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><button class="{{t.cls}}" aria-pressed="{{t.on}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for></div>
  </div>
  <div class="sc" style="padding-top: 0; gap: 12px">
    <sc-for list="{{rows}}" as="a" hint-placeholder-count="4">
      <a href="JobDetail.dc.html" data-job="{{a.variant}}" data-app="{{a.status}}" class="card" style="text-decoration: none; gap: 8px">
        <div class="row" style="align-items: flex-start; gap: 10px"><div class="sp"><div class="t-h3 clamp2">{{a.title}}</div><div class="t-s mut" style="margin-top: 2px">{{a.org}}</div></div><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #6B6676"><path d="m9 18 6-6-6-6"></path></svg></div>
        <div class="meta"><span><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>{{a.loc}}</span><span><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{a.dur}}</span></div>
        <div class="row" style="gap: 8px"><span class="{{a.badge}}">{{a.status}}</span><span class="t-c mut">Applied {{a.applied}}</span><span class="sp"></span><sc-if value="{{a.isNew}}" hint-placeholder-val="{{ false }}"><span class="t-c b" style="color: #2C6619">Updated 2h ago</span></sc-if></div>
      </a>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div class="empty"><div class="ring"><svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"></path></svg></div><div class="t-h3">No applications here</div><div class="t-s mut">Jobs you apply for will show up here with their latest status.</div><a class="btn btn-s" href="JobSearch.dc.html">Find jobs</a></div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"store": {"editor": null}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.data = [
      { variant: 'main', title: 'Focus Puller — Feature Film (Hindi), 32-day schedule', org: 'Lantern Pictures', loc: 'Film City, Mumbai', dur: '32 days', status: 'Shortlisted', applied: '26 Oct 2026', isNew: true },
      { variant: 'disc', title: 'Second Unit Camera Operator — Action Feature', org: 'Redline Motion Pictures', loc: 'Ramoji Film City, Hyderabad', dur: '18 days', status: 'Under Review', applied: '29 Oct 2026' },
      { variant: 'tvc', title: 'Focus Puller — TVC, 2-day shoot', org: 'Pinewood Ads', loc: 'Bandra, Mumbai', dur: '2 days', status: 'Applied', applied: '1 Nov 2026' },
      { variant: 'mv', title: 'Camera Operator — Music Video', org: 'Bluebird Records', loc: 'Versova, Mumbai', dur: '3 days', status: 'Rejected', applied: '9 Oct 2026' }
    ];
    this.state = { tab: 'All' };
  }
  renderVals() {
    const s = this.state;
    const extra = (this.props.store && this.props.store.applied) || [];
    const all = extra.concat(this.data);
    const B = { Applied: 'badge b-n', 'Under Review': 'badge b-p', Shortlisted: 'badge b-g', 'On Hold': 'badge b-w', Selected: 'badge b-g', Rejected: 'badge b-e' };
    const tabs = ['All', 'Applied', 'Under Review', 'Shortlisted', 'Rejected'];
    const list = all.filter((a) => s.tab === 'All' || a.status === s.tab);
    return {
      nAll: all.length, nActive: all.filter((a) => a.status !== 'Rejected' && a.status !== 'Selected').length, nShort: all.filter((a) => a.status === 'Shortlisted').length,
      tabs: tabs.map((t) => ({ label: t === 'All' ? 'All · ' + all.length : t, on: s.tab === t, cls: s.tab === t ? 'chip on' : 'chip', pick: () => this.setState({ tab: t }) })),
      rows: list.map((a) => ({ ...a, badge: B[a.status], isNew: !!a.isNew })), empty: list.length === 0
    };
  }
}
</script>
</body>
</html>
