<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose how you'll use CrewConnect</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="./cc.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B2A8C}a:hover{color:#4A1F73}
</style>
</helmet>
<div class="ph">
  <div class="sc" style="padding: 48px 24px 24px; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div class="badge b-g" style="align-self: flex-start"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Email verified</div>
      <h1 class="t-d">How will you use CrewConnect?</h1>
      <p class="t-b mut">Choose the account type that fits you. We'll tailor your home screen and tools to it.</p>
    </div>
    <div role="radiogroup" aria-label="Account type" style="display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{roles}}" as="r" hint-placeholder-count="3">
        <button role="radio" aria-checked="{{r.on}}" onClick="{{r.pick}}" style="{{r.style}}">
          <span class="{{r.icoCls}}" style="width: 48px; height: 48px">
            <sc-if value="{{r.isSeeker}}" hint-placeholder-val="{{ false }}"><svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"></path></svg></sc-if>
            <sc-if value="{{r.isPoster}}" hint-placeholder-val="{{ false }}"><svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"></path></svg></sc-if>
            <sc-if value="{{r.isVendor}}" hint-placeholder-val="{{ false }}"><svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"></path><path d="M3 7.5 12 12l9-4.5M12 12v9"></path></svg></sc-if>
          </span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 3px; text-align: left">
            <span class="t-h3" style="font-size: 16px">{{r.title}}</span>
            <span class="t-s mut">{{r.desc}}</span>
          </span>
          <span class="{{r.radioCls}}"></span>
        </button>
      </sc-for>
    </div>
    <p class="help" style="text-align: center">You can add the other roles and switch between them any time from your profile.</p>
  </div>
  <div style="flex: none; padding: 12px 24px 36px">
    <sc-if value="{{has}}" hint-placeholder-val="{{ false }}">
      <a class="btn btn-p w100" href="{{next}}">Continue as {{label}}</a>
    </sc-if>
    <sc-if value="{{none}}" hint-placeholder-val="{{ true }}">
      <button class="btn w100 dis" disabled>Select an account type</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: null }; }
  renderVals() {
    const list = [
      { id: 'seeker', title: 'Job Seeker', desc: 'Find jobs and manage your professional profile.', next: 'SetupSeeker.dc.html', green: false },
      { id: 'poster', title: 'Job Poster', desc: 'Publish opportunities and manage applicants.', next: 'SetupPoster.dc.html', green: false },
      { id: 'vendor', title: 'Vendor', desc: 'List products and help industry professionals discover your business.', next: 'SetupVendor.dc.html', green: true }
    ];
    const sel = list.find((r) => r.id === this.state.sel);
    return {
      roles: list.map((r) => {
        const on = this.state.sel === r.id;
        return {
          ...r, on,
          isSeeker: r.id === 'seeker', isPoster: r.id === 'poster', isVendor: r.id === 'vendor',
          icoCls: r.green ? 'sq g' : 'sq',
          radioCls: on ? 'radio on' : 'radio',
          style: 'display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;cursor:pointer;width:100%;font:inherit;color:#1D1B22;' + (on ? 'background:#F7F2FB;border:2px solid #5B2A8C;' : 'background:#FFFFFF;border:2px solid #E7E3EA;'),
          pick: () => this.setState({ sel: r.id })
        };
      }),
      has: !!sel, none: !sel,
      next: sel ? sel.next : '#',
      label: sel ? sel.title : ''
    };
  }
}
</script>
</body>
</html>
