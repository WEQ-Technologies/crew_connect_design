<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Association logo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<span role="img" aria-label="{{label}}" style="{{tile}}">
  <sc-if value="{{hasSrc}}" hint-placeholder-val="{{ false }}"><img src="{{src}}" alt="" style="width: 100%; height: 100%; object-fit: contain"></sc-if>
  <sc-if value="{{noSrc}}" hint-placeholder-val="{{ true }}">
    <span style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{iconStyle}}"><path d="{{icon}}"></path></svg>
      <sc-if value="{{showCode}}" hint-placeholder-val="{{ true }}"><span style="{{codeStyle}}">{{code}}</span></sc-if>
    </span>
  </sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"code":{"editor":"enum","options":["CTG","WLA","SSP","IPC","ADG","CMF","EPF","SCA","DCI","SAA"],"default":"CTG"},"size":{"editor":"number","default":56},"src":{"editor":null},"$preview":{"width":96,"height":96}}'>
/* CrewConnect content: user-facing text is read from crewconnect_content.json by content key. Edit the text there, not here. */
var CC = (function (w) {
  if (w.__ccContent) return w.__ccContent;
  var doc = null, src = './crewconnect_content.json';
  try {
    var R = w.__resources, B = w.__resourceBlobs, k, v;
    if (R) for (k in R) if (/crewconnect_content\.json$/.test(k)) { v = R[k]; if (B && B[v] instanceof Blob) v = URL.createObjectURL(B[v]); else if (B && B[k] instanceof Blob) v = URL.createObjectURL(B[k]); src = v; break; }
    var x = new XMLHttpRequest(); x.open('GET', src, false); x.send(null);
    if (x.status === 200 || (x.status === 0 && x.responseText)) doc = JSON.parse(x.responseText);
  } catch (e) { console.error('[CrewConnect] crewconnect_content.json could not be loaded', e); }
  var flat = {}, tree = {}, vmap = {}, changed = false;
  function put(e) {
    var t = (e.client_text === undefined || e.client_text === null || e.client_text === '') ? e.original_text : String(e.client_text);
    flat[e.content_key] = t;
    var p = e.content_key.split('.'), o = tree;
    for (var i = 0; i < p.length - 1; i++) o = o[p[i]] || (o[p[i]] = {});
    o[p[p.length - 1]] = t;
    if (e.binding && e.binding !== 'direct' && t !== e.original_text) { vmap[e.original_text] = t; changed = true; }
  }
  if (doc) { (doc.shared || []).forEach(put); (doc.screens || []).forEach(function (s) { (s.content || []).forEach(put); }); }
  else console.error('[CrewConnect] content file missing: text keys will show instead of copy');
  return (w.__ccContent = { doc: doc, ok: !!doc, flat: flat, tree: tree, vmap: vmap, changed: changed });
})(window);
var cct = CC.tree;
function cc(key, vars) {
  var t = CC.flat[key];
  if (t === undefined) return CC.ok ? '' : '[' + key + ']';
  return vars ? t.replace(/\{(\w+)\}/g, function (m, n) { return Object.prototype.hasOwnProperty.call(vars, n) ? vars[n] : m; }) : t;
}
function ccv(x) { return (CC.changed && typeof x === 'string' && Object.prototype.hasOwnProperty.call(CC.vmap, x)) ? CC.vmap[x] : x; }
function ccHook(C, skip) {
  var rv = C.prototype.renderVals;
  function tr(v, d, keep) {
    if (typeof v === 'string') return ccv(v);
    if (!v || typeof v !== 'object' || d > 6 || keep.indexOf(v) >= 0) return v;
    var proto = Object.getPrototypeOf(v), out = v, i, k, n;
    if (Array.isArray(v)) { for (i = 0; i < v.length; i++) { n = tr(v[i], d + 1, keep); if (n !== v[i]) { if (out === v) out = v.slice(); out[i] = n; } } return out; }
    if (proto !== Object.prototype && proto !== null) return v;
    for (k in v) { if (/^(v|value|id|key|href|src|cls|class\w*|\w*Cls|style|\w*Style|ini|data\w*|code|store|act)$/.test(k)) continue; n = tr(v[k], d + 1, keep); if (n !== v[k]) { if (out === v) out = Object.assign({}, v); out[k] = n; } }
    return out;
  }
  C.prototype.renderVals = function () {
    var o = rv.apply(this, arguments) || {};
    if (CC.changed) {
      var keep = [], self = this, k;
      ['props', 'state'].forEach(function (s) { var x = self[s]; if (x && typeof x === 'object') { keep.push(x); for (k in x) if (x[k] && typeof x[k] === 'object') keep.push(x[k]); } });
      var r = {};
      for (k in o) r[k] = (skip.indexOf(k) >= 0) ? o[k] : tr(o[k], 0, keep);
      o = r;
    }
    o.cct = cct;
    return o;
  };
}

/* CrewConnect Association & Forum data (mock, from crewconnect_content.json › assoc_module). Shape is ready for a backend API. */
var AF = (function (w) {
  if (w.__ccAssoc) return w.__ccAssoc;
  var m = (w.__ccContent && w.__ccContent.doc && w.__ccContent.doc.assoc_module) || { entities: [], notices: [], departments: [], variants: {}, recentFrom: '2026-10-20' };
  var byId = {};
  m.entities.forEach(function (e) { byId[e.id] = e; });
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function fmt(iso, withTime) {
    if (!iso) return '';
    var d = new Date(iso); if (isNaN(d)) return iso;
    var s = d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear();
    if (withTime === false) return s;
    var h = d.getHours(), mi = d.getMinutes(), ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
    return s + ', ' + h + ':' + (mi < 10 ? '0' : '') + mi + ' ' + ap;
  }
  function nowIso() { var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':00'; }
  // Notices = seed data + this session's changes (store.notices: created[], edited{id: patch}, deleted{id: true}).
  function notices(store) {
    var n = (store && store.notices) || {}, cr = n.created || [], ed = n.edited || {}, del = n.deleted || {};
    return cr.concat(m.notices).filter(function (x) { return !del[x.id] && byId[x.entity]; })
      .map(function (x) { return ed[x.id] ? Object.assign({}, x, ed[x.id]) : x; })
      .sort(function (a, b) { return a.postedAt < b.postedAt ? 1 : -1; });
  }
  function canPublish(e) { return !!e && e.status === 'active' && e.access === 'issued'; }
  function entityByEmail(em) { em = (em || '').trim().toLowerCase(); for (var i = 0; i < m.entities.length; i++) if (m.entities[i].email === em) return m.entities[i]; return null; }
  function preview(x) { var b = x.body || []; for (var i = 0; i < b.length; i++) if (typeof b[i] === 'string') return b[i]; return ''; }
  return (w.__ccAssoc = { m: m, entities: m.entities, byId: byId, depts: m.departments, fmt: fmt, nowIso: nowIso, notices: notices, canPublish: canPublish, entityByEmail: entityByEmail, preview: preview, isOld: function (x) { return x.postedAt < m.recentFrom; } });
})(window);

class Component extends DCLogic {
  renderVals() {
    // Stand-in emblems until each association uploads its own logo (pass src to use the uploaded file).
    // Logo tiles come from the entity record (assoc_module). Pass src to use an uploaded logo.
    const L = AF.byId;
    const k = L[this.props.code] ? this.props.code : 'CTG';
    const d = L[k];
    const size = Number(this.props.size) || 56;
    const r = Math.round(size * 0.28);
    const showCode = size >= 52;
    const ic = Math.round(size * (showCode ? 0.42 : 0.56));
    const src = this.props.src || '';
    return {
      label: d.name + cc("assoc_logo.logo"), code: k, icon: d.iconPath, src, hasSrc: !!src, noSrc: !src, showCode,
      tile: cc("assoc_logo.width") + size + cc("assoc_logo.px_height") + size + cc("assoc_logo.px_border_radius") + r + cc("assoc_logo.px_flex_none_display_inline") +
        (src ? 'background:#fff;border:1px solid #E1EADF;padding:' + Math.round(size * 0.1) + 'px' : 'background:linear-gradient(145deg,' + d.a + ' 0%,' + d.b + ' 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 ' + Math.max(2, Math.round(size / 12)) + 'px ' + Math.round(size / 4) + cc("assoc_logo.px") + Math.round(size / 10) + 'px rgba(26,24,32,.45)'),
      iconStyle: cc("assoc_logo.width") + ic + cc("assoc_logo.px_height") + ic + cc("assoc_logo.px_display_block"),
      codeStyle: 'font:800 ' + Math.max(9, Math.round(size * 0.15)) + cc("assoc_logo.px_1_inter_system_ui")
    };
  }
}
ccHook(Component, []);
</script>
</body>
</html>
