<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discover jobs</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./cc.css">
<script src="./cc-liquid.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7C3AED}a:hover{color:#6527C8}
</style>
</helmet>
<div class="ph">
  <div class="bar"><div class="ttl" style="padding-left: 12px; font-size: 20px">{{cct.common.discover_jobs}}</div></div>
  <div style="flex: none; padding: 4px 20px 12px; display: flex; flex-direction: column; gap: 12px">
    <div class="srch">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input placeholder="{{cct.common.search_jobs_roles_or_locations}}" value="{{q}}" onChange="{{onQ}}" aria-label="{{cct.common.search_jobs_roles_or_locations}}">
      <sc-if value="{{hasQ}}" hint-placeholder-val="{{ false }}"><button class="iconbtn" onClick="{{clearQ}}" aria-label="{{cct.common.clear_search}}" style="width: 40px; height: 40px"><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></sc-if>
    </div>
    <div class="chips x">
      <button class="{{fBtnCls}}" onClick="{{openF}}" aria-label="{{cct.job_search.open_filters}}{{fN}}{{cct.job_search.selected}}" style="display: inline-flex; align-items: center; gap: 6px; flex: none"><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>{{cct.common.filters}}<sc-if value="{{fHasN}}" hint-placeholder-val="{{ false }}"><span style="min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: #fff; color: #7C3AED; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center">{{fN}}</span></sc-if></button>
      <sc-for list="{{active}}" as="a" hint-placeholder-count="0">
        <button class="chip on" onClick="{{a.remove}}" aria-label="{{cct.job_search.remove_filter}}{{a.label}}">{{a.label}}<svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </sc-for>
      <sc-if value="{{fHasN}}" hint-placeholder-val="{{ false }}"><button class="btn btn-t btn-sm" onClick="{{clearFilters}}" style="flex: none">Clear all</button></sc-if>
    </div>
  </div>

  <div class="sc" style="padding-top: 0; gap: 12px">
    <div class="row"><span class="t-s mut sp" role="status"><b style="color: #1A1820">{{count}}</b> {{countWord}}</span><span class="t-c mut">{{cct.common.newest_first}}</span></div>
    <sc-for list="{{results}}" as="j" hint-placeholder-count="4">
      <a href="JobDetail.dc.html" data-job="{{j.variant}}" class="card" style="text-decoration: none">
        <div class="row" style="align-items: flex-start; gap: 12px">
          <div class="sp"><div class="t-h3 clamp2">{{j.title}}</div><div class="t-s mut" style="margin-top: 2px">{{j.org}}</div></div>
          <span class="t-c mut" style="white-space: nowrap; padding-top: 2px">{{j.ago}}</span>
        </div>
        <div class="meta">
          <span><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1"></rect><rect x="13" y="4" width="7" height="7" rx="1"></rect><rect x="4" y="13" width="7" height="7" rx="1"></rect><rect x="13" y="13" width="7" height="7" rx="1"></rect></svg>{{j.deptL}}</span>
          <span><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>{{j.loc}}</span>
          <span><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{j.dur}}</span>
        </div>
        <sc-if value="{{j.hasTags}}" hint-placeholder-val="{{ false }}"><div class="chips"><sc-for list="{{j.tags}}" as="t" hint-placeholder-count="2"><span class="tag">{{t}}</span></sc-for></div></sc-if>
        <span class="pay">{{j.pay}}</span><sc-if value="{{j.disc}}" hint-placeholder-val="{{ false }}"><div class="alert a-w" style="padding: 8px 10px; font-size: 12px; line-height: 16px; align-self: stretch"><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20z"></path><path d="M12 10v4M12 17v.01"></path></svg><span>{{cct.r2.job_posters_may_be_employees}}</span></div></sc-if>
      </a>
    </sc-for>
    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
      <div class="empty">
        <div class="ring"><svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></div>
        <div class="t-h2">{{cct.job_search.no_jobs_match_your_search}}</div>
        <div class="t-s mut" style="max-width: 270px">{{cct.job_search.try_a_different_keyword_a}}</div>
        <button class="btn btn-s" onClick="{{clearAll}}" style="margin-top: 4px">{{cct.job_search.clear_search_and_filters}}</button>
      </div>
    </sc-if>
  </div>

  <dc-import name="RoleNav" fit="yes" active="jobs" hint-size="390px,80px"></dc-import>

  <sc-if value="{{fOpen}}" hint-placeholder-val="{{ false }}"><dc-import name="FiltersPage" title="{{fTitle}}" sections="{{fSecs}}" value="{{fVal}}" preview="{{fPrev}}" noun="{{fNoun}}" onApply="{{fApply}}" onClose="{{fClose}}" hint-size="390px,844px" style="position: absolute; inset: 0; z-index: 60"></dc-import></sc-if>
</div>
</x-dc>
