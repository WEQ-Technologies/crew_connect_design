<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discover jobs</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="./cc.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B2A8C}a:hover{color:#4A1F73}
</style>
</helmet>
<div class="ph">
  <div class="bar"><div class="ttl" style="padding-left: 12px; font-size: 20px">Discover jobs</div></div>
  <div style="flex: none; padding: 4px 20px 12px; display: flex; flex-direction: column; gap: 12px">
    <div class="srch">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input placeholder="Search jobs, roles or locations" value="{{q}}" onChange="{{onQ}}" aria-label="Search jobs, roles or locations">
      <sc-if value="{{hasQ}}" hint-placeholder-val="{{ false }}"><button class="iconbtn" onClick="{{clearQ}}" aria-label="Clear search" style="width: 40px; height: 40px"><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></sc-if>
    </div>
    <div class="chips x">
      <button class="{{filterBtnCls}}" onClick="{{openSheet}}"><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>Filters{{filterCount}}</button>
      <sc-for list="{{active}}" as="a" hint-placeholder-count="0">
        <button class="chip on" onClick="{{a.remove}}" aria-label="Remove filter {{a.label}}">{{a.label}}<svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </sc-for>
    </div>
  </div>

  <div class="sc" style="padding-top: 0; gap: 12px">
    <div class="row"><span class="t-s mut sp" role="status"><b style="color: #1D1B22">{{count}}</b> {{countWord}}</span><span class="t-c mut">Newest first</span></div>
    <sc-for list="{{results}}" as="j" hint-placeholder-count="4">
      <a href="JobDetail.dc.html" class="card" style="text-decoration: none">
        <div class="row" style="align-items: flex-start; gap: 12px">
          <div class="sp"><div class="t-h3 clamp2">{{j.title}}</div><div class="t-s mut" style="margin-top: 2px">{{j.org}}</div></div>
          <span class="t-c mut" style="white-space: nowrap; padding-top: 2px">{{j.ago}}</span>
        </div>
        <div class="meta">
          <span><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1"></rect><rect x="13" y="4" width="7" height="7" rx="1"></rect><rect x="4" y="13" width="7" height="7" rx="1"></rect><rect x="13" y="13" width="7" height="7" rx="1"></rect></svg>{{j.cat}}</span>
          <span><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>{{j.loc}}</span>
        </div>
        <span class="pay">{{j.pay}}</span>
      </a>
    </sc-for>
    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
      <div class="empty">
        <div class="ring"><svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></div>
        <div class="t-h2">No jobs match your search</div>
        <div class="t-s mut" style="max-width: 270px">Try a different keyword, a nearby city, or fewer filters. New jobs are posted every day.</div>
        <button class="btn btn-s" onClick="{{clearAll}}" style="margin-top: 4px">Clear search and filters</button>
      </div>
    </sc-if>
  </div>

  <nav class="nav" aria-label="Main">
    <a href="SeekerHome.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path></svg></span>Home</a>
    <a class="on" href="JobSearch.dc.html" aria-current="page"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></span>Discover</a>
    <a href="Calendar.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg></span>Calendar</a>
    <a href="Invoices.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg></span>Invoices</a>
    <a href="SeekerProfile.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>Profile</a>
  </nav>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}">
    <div class="scrim">
      <div class="sheet" role="dialog" aria-label="Filters">
        <div class="grab"></div>
        <div class="row"><div class="t-h2 sp">Filters</div><button class="iconbtn" onClick="{{closeSheet}}" aria-label="Close filters"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
        <div class="t-over">Category</div>
        <div class="chips"><sc-for list="{{dCats}}" as="c" hint-placeholder-count="6"><button class="{{c.cls}}" onClick="{{c.toggle}}" aria-pressed="{{c.on}}">{{c.label}}</button></sc-for></div>
        <div class="t-over" style="margin-top: 4px">Location</div>
        <div class="chips"><sc-for list="{{dLocs}}" as="c" hint-placeholder-count="5"><button class="{{c.cls}}" onClick="{{c.toggle}}" aria-pressed="{{c.on}}">{{c.label}}</button></sc-for></div>
        <div style="display: flex; gap: 12px; margin-top: 8px">
          <button class="btn btn-s" onClick="{{clearDraft}}" style="flex: 1">Clear all</button>
          <button class="btn btn-p" onClick="{{apply}}" style="flex: 2">Show {{draftCount}} jobs</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.jobs = [
      { title: 'Focus Puller — Feature Film (Hindi), 32-day schedule', org: 'Lantern Pictures', cat: 'Camera', city: 'Mumbai', loc: 'Film City, Mumbai', pay: '₹8,000 – ₹12,000 / day', ago: '2d ago' },
      { title: 'Second Unit Camera Operator — Action Feature', org: 'Redline Motion Pictures', cat: 'Camera', city: 'Hyderabad', loc: 'Ramoji Film City, Hyderabad', pay: '₹10,000 – ₹14,000 / day', ago: '2d ago' },
      { title: 'Assistant Editor — Web Series (8 episodes)', org: 'Northlight Studios', cat: 'Editing & Post', city: 'Mumbai', loc: 'Andheri West, Mumbai', pay: '₹55,000 – ₹70,000 / month', ago: '3d ago' },
      { title: 'Location Sound Recordist — Wildlife Documentary', org: 'Kite & Kettle Films', cat: 'Sound', city: 'Other', loc: 'Leh, Ladakh (travel)', pay: '₹6,000 – ₹9,000 / day', ago: '4d ago' },
      { title: 'Gaffer — TVC, 2-day shoot', org: 'Pinewood Ads', cat: 'Lighting & Grip', city: 'Mumbai', loc: 'Bandra, Mumbai', pay: 'Payment not specified', ago: '5d ago' },
      { title: 'Colourist — Independent Feature (DaVinci Resolve)', org: 'Saffron Frame', cat: 'Editing & Post', city: 'Bengaluru', loc: 'Indiranagar, Bengaluru', pay: '₹2,50,000 project fee', ago: '6d ago' },
      { title: 'Supporting Actor (Male, 30–40) — Short Film', org: 'Third Bell Collective', cat: 'Cast', city: 'Pune', loc: 'Pune, Maharashtra', pay: '₹15,000 flat', ago: '1w ago' },
      { title: 'First Assistant Director — Music Video', org: 'Bluebird Records', cat: 'Direction', city: 'Mumbai', loc: 'Versova, Mumbai', pay: '₹7,000 / day', ago: '1w ago' }
    ];
    this.cats = ['Camera', 'Direction', 'Editing & Post', 'Sound', 'Lighting & Grip', 'Cast'];
    this.locs = ['Mumbai', 'Hyderabad', 'Bengaluru', 'Pune', 'Other'];
    this.state = { q: '', cats: ['Camera'], locs: ['Mumbai'], sheet: false, dCats: [], dLocs: [] };
  }
  filter(q, cats, locs) {
    const s = q.trim().toLowerCase();
    return this.jobs.filter((j) =>
      (!s || (j.title + ' ' + j.org + ' ' + j.loc + ' ' + j.cat).toLowerCase().includes(s)) &&
      (!cats.length || cats.includes(j.cat)) &&
      (!locs.length || locs.includes(j.city)));
  }
  renderVals() {
    const st = this.state;
    const res = this.filter(st.q, st.cats, st.locs);
    const n = st.cats.length + st.locs.length;
    const tog = (arr, v) => (arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]);
    return {
      q: st.q, hasQ: !!st.q,
      onQ: (e) => this.setState({ q: e.target.value }),
      clearQ: () => this.setState({ q: '' }),
      filterCount: n ? ' · ' + n : '',
      filterBtnCls: n ? 'chip' : 'chip',
      active: [
        ...st.cats.map((c) => ({ label: c, remove: () => this.setState({ cats: st.cats.filter((x) => x !== c) }) })),
        ...st.locs.map((c) => ({ label: c, remove: () => this.setState({ locs: st.locs.filter((x) => x !== c) }) }))
      ],
      results: res, count: res.length, countWord: res.length === 1 ? 'job found' : 'jobs found', isEmpty: res.length === 0,
      clearAll: () => this.setState({ q: '', cats: [], locs: [] }),
      sheet: st.sheet,
      openSheet: () => this.setState({ sheet: true, dCats: st.cats, dLocs: st.locs }),
      closeSheet: () => this.setState({ sheet: false }),
      dCats: this.cats.map((c) => ({ label: c, on: st.dCats.includes(c), cls: st.dCats.includes(c) ? 'chip on' : 'chip', toggle: () => this.setState({ dCats: tog(st.dCats, c) }) })),
      dLocs: this.locs.map((c) => ({ label: c, on: st.dLocs.includes(c), cls: st.dLocs.includes(c) ? 'chip on' : 'chip', toggle: () => this.setState({ dLocs: tog(st.dLocs, c) }) })),
      draftCount: this.filter(st.q, st.dCats, st.dLocs).length,
      clearDraft: () => this.setState({ dCats: [], dLocs: [] }),
      apply: () => this.setState({ cats: st.dCats, locs: st.dLocs, sheet: false })
    };
  }
}
</script>
</body>
</html>
