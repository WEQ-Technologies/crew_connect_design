<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discover vendors</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="./cc.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B2A8C}a:hover{color:#4A1F73}
</style>
</helmet>
<div class="ph">
  <div class="bar"><sc-if value="{{notVendor}}" hint-placeholder-val="{{ false }}"><a class="iconbtn" href="{{backHref}}" aria-label="Back"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a></sc-if><div class="ttl" style="padding-left: 12px; font-size: 20px">Discover vendors</div></div>
  <div style="flex: none; padding: 4px 20px 12px; display: flex; flex-direction: column; gap: 12px">
    <div class="srch"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input placeholder="Search equipment, vendors or cities" value="{{q}}" onChange="{{onQ}}" aria-label="Search vendors"></div>
    <div class="chips x"><sc-for list="{{cats}}" as="c" hint-placeholder-count="6"><button class="{{c.cls}}" onClick="{{c.pick}}" aria-pressed="{{c.on}}">{{c.label}}</button></sc-for></div>
    <div class="seg" style="grid-template-columns: repeat(3, minmax(0, 1fr))"><sc-for list="{{modes}}" as="m" hint-placeholder-count="3"><button class="{{m.cls}}" onClick="{{m.pick}}" aria-pressed="{{m.on}}">{{m.label}}</button></sc-for></div>
  </div>
  <div class="sc" style="padding-top: 0; gap: 12px">
    <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 12px" aria-busy="true" aria-label="Loading vendors">
        <div class="card"><div class="row" style="gap: 12px"><div class="skel" style="width: 44px; height: 44px; border-radius: 12px"></div><div class="sp" style="display: flex; flex-direction: column; gap: 8px"><div class="skel" style="height: 14px; width: 70%"></div><div class="skel" style="height: 12px; width: 50%"></div></div></div><div class="skel" style="height: 12px; width: 85%"></div></div>
        <div class="card"><div class="row" style="gap: 12px"><div class="skel" style="width: 44px; height: 44px; border-radius: 12px"></div><div class="sp" style="display: flex; flex-direction: column; gap: 8px"><div class="skel" style="height: 14px; width: 60%"></div><div class="skel" style="height: 12px; width: 40%"></div></div></div><div class="skel" style="height: 12px; width: 75%"></div></div>
      </div>
    </sc-if>
    <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div class="t-s mut" role="status"><b style="color: #1D1B22">{{count}}</b> {{countWord}}</div>
        <sc-for list="{{vendors}}" as="v" hint-placeholder-count="4">
          <a href="VendorPublic.dc.html" class="card" style="text-decoration: none">
            <div class="row" style="gap: 12px"><div class="sq g"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9 5.5 4h13L20 9"></path><path d="M4 9h16v2a3 3 0 0 1-5.3 2 3 3 0 0 1-5.4 0A3 3 0 0 1 4 11z"></path><path d="M5 13v7h14v-7"></path></svg></div><div class="sp"><div class="t-h3">{{v.name}}</div><div class="t-s mut">{{v.cat}} · {{v.city}}</div></div><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #6E6876"><path d="m9 18 6-6-6-6"></path></svg></div>
            <div class="t-s clamp2">{{v.blurb}}</div>
            <div class="chips"><span class="tag">{{v.mode}}</span><span class="tag">{{v.n}} listings</span></div>
          </a>
        </sc-for>
        <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
          <div class="empty"><div class="ring"><svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"></path><path d="M3 7.5 12 12l9-4.5M12 12v9"></path></svg></div><div class="t-h2">No vendors found</div><div class="t-s mut" style="max-width: 260px">Try a broader category or search a nearby city.</div><button class="btn btn-s" onClick="{{reset}}">Clear filters</button></div>
        </sc-if>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{isVendor}}" hint-placeholder-val="{{ true }}">
  <nav class="nav" aria-label="Main">
    <a href="VendorHome.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path></svg></span>Home</a>
    <a href="MyListings.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"></path><path d="M3 7.5 12 12l9-4.5M12 12v9"></path></svg></span>My Listings</a>
    <a class="on" href="Discover.dc.html" aria-current="page"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></span>Discover</a>
    <a href="Invoices.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg></span>Invoices</a>
    <a href="VendorProfile.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9 5.5 4h13L20 9"></path><path d="M4 9h16v2a3 3 0 0 1-5.3 2 3 3 0 0 1-5.4 0A3 3 0 0 1 4 11z"></path><path d="M5 13v7h14v-7"></path></svg></span>Profile</a>
  </nav>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["vendor","poster","seeker"],"default":"vendor"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.data = [
      { name: 'Reelhouse Camera Rentals', cat: 'Camera & lenses', city: 'Mumbai', mode: 'Rent & buy', n: 14, blurb: 'Camera bodies, cine lenses and monitoring. Prepped kits with pickup or Mumbai delivery.' },
      { name: 'Kilowatt Lighting Co.', cat: 'Lighting & grip', city: 'Mumbai', mode: 'Rent', n: 32, blurb: 'HMIs, LED panels, generators and grip trucks for features and TVCs, with operators on request.' },
      { name: 'Quiet Room Audio', cat: 'Sound', city: 'Pune', mode: 'Rent & buy', n: 9, blurb: 'Field recorders, wireless kits and boom packages for location sound teams.' },
      { name: 'SkyFrame Aerials', cat: 'Drones', city: 'Bengaluru', mode: 'Rent', n: 6, blurb: 'Cinema drones with licensed pilots for features, documentaries and ads.' },
      { name: 'Wardrobe Junction', cat: 'Costume & props', city: 'Hyderabad', mode: 'Rent & buy', n: 120, blurb: 'Period and contemporary costume stock plus hand props, with an in-house tailoring team.' }
    ];
    this.state = { q: '', cat: 'All', mode: 'All', loading: false };
  }
  componentWillUnmount() { clearTimeout(this.t); }
  load(patch) { this.setState({ ...patch, loading: true }); clearTimeout(this.t); this.t = setTimeout(() => this.setState({ loading: false }), 600); }
  renderVals() {
    const s = this.state, q = s.q.trim().toLowerCase();
    const list = this.data.filter((v) => (s.cat === 'All' || v.cat === s.cat) && (s.mode === 'All' || v.mode.includes(s.mode)) && (!q || (v.name + v.cat + v.city + v.blurb).toLowerCase().includes(q)));
    const role = this.props.role ?? 'vendor';
    return {
      isVendor: role === 'vendor', notVendor: role !== 'vendor',
      backHref: role === 'poster' ? 'PosterHome.dc.html' : 'SeekerHome.dc.html',
      q: s.q, onQ: (e) => this.setState({ q: e.target.value }),
      cats: ['All', 'Camera & lenses', 'Lighting & grip', 'Sound', 'Drones', 'Costume & props'].map((c) => ({ label: c, on: s.cat === c, cls: s.cat === c ? 'chip on' : 'chip', pick: () => this.load({ cat: c }) })),
      modes: ['All', 'Rent', 'Buy'].map((m) => ({ label: m === 'All' ? 'Rent or buy' : m, on: s.mode === m, cls: s.mode === m ? 'on' : '', pick: () => this.load({ mode: m }) })),
      loading: s.loading, ready: !s.loading,
      vendors: list, count: list.length, countWord: list.length === 1 ? 'vendor' : 'vendors', empty: list.length === 0,
      reset: () => this.load({ q: '', cat: 'All', mode: 'All' })
    };
  }
}
</script>
</body>
</html>
