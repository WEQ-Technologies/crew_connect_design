<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrewConnect Design Prototypes</title>
  <meta http-equiv="refresh" content="0; url=/v4/">
  <script>
    window.location.replace("/v4/" + window.location.search + window.location.hash);
  </script>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0B0E14;
      color: #E6EDF3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 85vh;
      text-align: center;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    p {
      color: #8B949E;
      margin-bottom: 30px;
      font-size: 15px;
    }

    .versions {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
    }

    a.btn {
      padding: 12px 24px;
      background: #5B2A8C;
      color: #FFFFFF;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      transition: background 0.2s;
    }

    a.btn:hover {
      background: #783AB8;
    }

    a.btn-secondary {
      background: #21262D;
      color: #C9D1D9;
      border: 1px solid #30363D;
    }

    a.btn-secondary:hover {
      background: #30363D;
    }
  </style>
</head>

<body>
  <h1>CrewConnect Design Prototypes</h1>
  <p>Redirecting to the latest version (v4 Glassmorphism V2)...</p>
  <div class="versions">
    <a class="btn" href="/v4/">Launch v4 (Glassmorphism V2)</a>
    <a class="btn btn-secondary" href="/v3/bento/">Launch v3 (Bento Grid)</a>
    <a class="btn btn-secondary" href="/v2/glass/">Launch v2 (Glassmorphism)</a>
    <a class="btn btn-secondary" href="/v1/">Launch v1 (Classic)</a>
  </div>
</body>

</html>
