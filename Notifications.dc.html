<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="./cc.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B2A8C}a:hover{color:#4A1F73}
</style>
</helmet>
<div class="ph">
  <div class="bar"><a class="iconbtn" href="SeekerHome.dc.html" aria-label="Back"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><div class="ttl">Notifications</div>
    <sc-if value="{{hasUnread}}" hint-placeholder-val="{{ true }}"><button class="btn btn-t btn-sm" onClick="{{markAll}}" style="margin-right: 8px">Mark all read</button></sc-if>
  </div>
  <div class="sc" style="gap: 12px; padding-top: 4px">
    <sc-if value="{{hasItems}}" hint-placeholder-val="{{ true }}">
      <div class="list">
        <sc-for list="{{items}}" as="n" hint-placeholder-count="5">
          <div class="li" style="{{n.rowStyle}}">
            <div style="position: relative; flex: none">
              <a href="UserProfile.dc.html" class="{{n.av}}" style="text-decoration: none">{{n.ini}}</a>
              <span style="{{n.typeStyle}}" aria-hidden="true">
                <sc-if value="{{n.isReq}}" hint-placeholder-val="{{ true }}"><svg class="i" viewBox="0 0 24 24" style="width: 12px; height: 12px; stroke-width: 2.6"><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="12" r="3"></circle><path d="M9 12h6"></path></svg></sc-if>
                <sc-if value="{{n.isAcc}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" style="width: 12px; height: 12px; stroke-width: 3"><path d="m5 12 5 5 9-10"></path></svg></sc-if>
              </span>
            </div>
            <div class="sp" style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
              <div><div class="t-s"><b>{{n.name}}</b> {{n.text}}</div><div class="t-c mut" style="margin-top: 2px">{{n.when}}</div></div>
              <sc-if value="{{n.showActions}}" hint-placeholder-val="{{ false }}">
                <div class="row" style="gap: 8px"><button class="btn btn-s btn-sm" onClick="{{n.decline}}" style="flex: 1">Decline</button><button class="btn btn-p btn-sm" onClick="{{n.accept}}" style="flex: 1">Accept</button></div>
              </sc-if>
              <sc-if value="{{n.resolved}}" hint-placeholder-val="{{ false }}"><span class="{{n.resolvedCls}}" style="align-self: flex-start">{{n.resolvedText}}</span></sc-if>
            </div>
            <sc-if value="{{n.unread}}" hint-placeholder-val="{{ true }}"><span style="width: 10px; height: 10px; border-radius: 5px; background: #5B2A8C; flex: none; margin-top: 6px" aria-label="Unread"></span></sc-if>
          </div>
        </sc-for>
      </div>
      <a href="Connections.dc.html" class="btn btn-s w100">View all connection requests</a>
    </sc-if>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div class="empty" style="padding-top: 80px"><div class="ring"><svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg></div><div class="t-h2">You're all caught up</div><div class="t-s mut">Connection requests and acceptances will show up here.</div></div>
    </sc-if>
  </div>
  <sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
    <div class="toast" role="status" style="bottom: 24px"><span class="ok"><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="m5 12 5 5 9-10"></path></svg></span>{{toastText}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"store":{"editor":null},"act":{"editor":null},"empty":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = {
      toast: '',
      items: [
        { id: 1, type: 'req', name: 'Vikram Bhosle', when: '2h ago', unread: true, done: null },
        { id: 2, type: 'acc', name: 'Farhan Siddiqui', when: '5h ago', unread: true, done: null },
        { id: 3, type: 'req', name: 'Northlight Studios', when: 'Yesterday', unread: false, done: null, vendorish: false },
        { id: 4, type: 'acc', name: 'Reelhouse Camera Rentals', when: '3 days ago', unread: false, done: null, v: true },
        { id: 5, type: 'req', name: 'Ananya Iyer', when: 'Last week', unread: false, done: 'accepted' }
      ]
    };
  }
  componentWillUnmount() { clearTimeout(this.t); }
  flash(m) { this.setState({ toast: m }); clearTimeout(this.t); this.t = setTimeout(() => this.setState({ toast: '' }), 2400); }
  renderVals() {
    const s = this.state;
    const empty = this.props.empty ?? false;
    const ini = (n) => n.split(' ').map((x) => x[0]).join('').slice(0, 2);
    const upd = (id, patch) => this.setState({ items: s.items.map((x) => (x.id === id ? { ...x, ...patch } : x)) });
    const st = this.props.store, act = this.props.act;
    // Unified prototype: request outcomes follow the shared connection store.
    const doneOf = (n) => (st && n.type === 'req' ? (st.conn[n.name] === 'received' ? null : st.conn[n.name] === 'connected' ? 'accepted' : 'declined') : n.done);
    const list = empty ? [] : s.items.map((n) => ({ ...n, done: doneOf(n) }));
    return {
      hasItems: list.length > 0, empty: list.length === 0,
      hasUnread: list.some((x) => x.unread),
      markAll: () => this.setState({ items: s.items.map((x) => ({ ...x, unread: false })) }),
      items: list.map((n) => {
        const isReq = n.type === 'req';
        return {
          ...n, ini: ini(n.name), av: n.v ? 'av g' : 'av', isReq, isAcc: !isReq,
          text: isReq ? 'sent you a connection request.' : 'accepted your connection request. You’re now connected.',
          rowStyle: 'cursor:default;align-items:flex-start;' + (n.unread ? 'background:#F7F2FB;' : ''),
          typeStyle: 'position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:10px;border:2px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;background:' + (isReq ? '#5B2A8C' : '#1E7D47'),
          showActions: isReq && !n.done,
          resolved: isReq && !!n.done,
          resolvedText: n.done === 'accepted' ? 'Accepted' : 'Declined',
          resolvedCls: n.done === 'accepted' ? 'badge b-g' : 'badge b-n',
          accept: () => { if (st && act) { act('conn', n.name, 'connected'); upd(n.id, { unread: false }); } else upd(n.id, { done: 'accepted', unread: false }); this.flash('You and ' + n.name + ' are now connected'); },
          decline: () => { if (st && act) { act('conn', n.name, 'none'); upd(n.id, { unread: false }); } else upd(n.id, { done: 'declined', unread: false }); this.flash('Request declined'); }
        };
      }),
      toast: !!s.toast, toastText: s.toast
    };
  }
}
</script>
</body>
</html>
