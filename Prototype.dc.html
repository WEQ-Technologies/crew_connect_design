<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1040}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.SCREENS = ['Splash', 'Welcome', 'SignUp', 'LogIn', 'Otp', 'RoleSelect', 'SetupSeeker', 'SetupPoster', 'SetupVendor',
      'SeekerHome', 'JobSearch', 'JobDetail', 'SeekerProfile', 'Calendar',
      'PosterHome', 'CreateJob', 'MyJobs', 'PosterJobDetail', 'Applicants', 'ApplicantDetail', 'Talent', 'PosterProfile',
      'VendorHome', 'MyListings', 'ListingForm', 'VendorPublic', 'Discover', 'VendorProfile',
      'Subscription', 'Invoices', 'InvoiceCreate', 'InvoiceDetail',
      'UserProfile', 'FollowList', 'FollowingFeed', 'Connections', 'Notifications',
      'ForumWall', 'NoticeDetail', 'AssociationProfile', 'AssocLogin', 'AssocNotices', 'NoticeForm'];
    this.TITLES = { Splash: 'Splash', Welcome: 'Welcome', SignUp: 'Sign up', LogIn: 'Log in', Otp: 'Email verification', RoleSelect: 'Choose role',
      SetupSeeker: 'Profile setup', SetupPoster: 'Company setup', SetupVendor: 'Vendor setup', SeekerHome: 'Home', JobSearch: 'Discover jobs', JobDetail: 'Job details',
      SeekerProfile: 'Profile', Calendar: 'Unavailability', PosterHome: 'Home', CreateJob: 'Post a job', MyJobs: 'My jobs', PosterJobDetail: 'Job (poster view)',
      Applicants: 'Applicants', ApplicantDetail: 'Applicant', Talent: 'Find talent', PosterProfile: 'Company page', VendorHome: 'Home', MyListings: 'My listings',
      ListingForm: 'Listing', VendorPublic: 'Vendor page', Discover: 'Discover vendors', VendorProfile: 'Vendor profile', Subscription: 'Subscription',
      Invoices: 'Invoices', InvoiceCreate: 'New invoice', InvoiceDetail: 'Invoice', UserProfile: 'User profile', FollowList: 'Followers & following',
      FollowingFeed: 'Following feed', Connections: 'Connections', Notifications: 'Notifications', ForumWall: 'Forum', NoticeDetail: 'Notice',
      AssociationProfile: 'Association', AssocLogin: 'Association login', AssocNotices: 'My notices', NoticeForm: 'Notice editor' };
    this.HOMES = { SeekerHome: 'seeker', PosterHome: 'poster', VendorHome: 'vendor', AssocNotices: 'association' };
    this.HOME_OF = { seeker: 'SeekerHome', poster: 'PosterHome', vendor: 'VendorHome', association: 'AssocNotices', guest: 'Welcome' };
    this.state = { stack: ['Splash'], role: 'guest', person: 'Meera Joshi', hide: null, noticeMode: 'create', store: this.initialStore() };
    this.screenEl = null;
    this.onClick = this.onClick.bind(this);
    this.screenRef = (el) => {
      if (el === this.screenEl) return;
      if (this.screenEl) this.screenEl.removeEventListener('click', this.onClick, true);
      this.screenEl = el;
      if (el) el.addEventListener('click', this.onClick, true);
    };
    this.act = (type, name, val) => {
      const s = this.state.store;
      if (type === 'follow') this.setState({ store: { ...s, follow: { ...s.follow, [name]: !!val } } });
      if (type === 'conn') this.setState({ store: { ...s, conn: { ...s.conn, [name]: val } } });
      if (type === 'plan') this.setState({ store: { ...s, plans: { ...s.plans, [name]: val } } });
    };
  }
  initialStore() {
    const meta = {
      'Meera Joshi': { sub: 'Focus Puller · Camera', role: 'Job Seeker' },
      'Kavya Menon': { sub: 'Producer · Lantern Pictures', role: 'Job Poster' },
      'Reelhouse Camera Rentals': { sub: 'Camera & lenses · Mumbai', role: 'Vendor' },
      'Vikram Bhosle': { sub: 'Gaffer · Lighting', role: 'Job Seeker', when: '2h ago', s1: 'Lighting design', s2: 'HMI', s3: 'LED walls', bio: 'Gaffer on TVCs and features for nearly two decades; leads crews of up to 12.' },
      'Northlight Studios': { sub: 'Production house · Mumbai', role: 'Job Poster', when: 'Yesterday', bio: 'Production house making web series and branded content in Mumbai.' },
      'Ananya Iyer': { sub: 'Editor · Editing & Post', role: 'Job Seeker', s1: 'Premiere Pro', s2: 'DaVinci Resolve', s3: 'Assembly cuts', bio: 'Editor for short films and branded content, looking for assistant editor roles on long-form.' },
      'Kilowatt Lighting Co.': { sub: 'Lighting & grip · Mumbai', role: 'Vendor', when: '1 week ago', bio: 'HMIs, LED panels, generators and grip trucks for features and TVCs.' },
      'Farhan Siddiqui': { sub: '1st Assistant Camera · Camera', role: 'Job Seeker', s1: 'Camera prep', s2: 'RED', s3: 'Data wrangling', bio: 'Camera assistant on Telugu and Hindi features; handles prep, data and lens management.' },
      'Arjun Kulkarni': { sub: 'Sound Recordist · Sound', role: 'Job Seeker', city: 'Pune', s1: 'Location sound', s2: 'Boom ops', s3: 'Sound Devices', bio: 'Location sound for documentaries and independent features.' },
      'Sana Mirza': { sub: 'Production Designer · Art', role: 'Job Seeker', when: '3 days ago', s1: 'Period sets', s2: 'Set dressing', s3: 'SketchUp', bio: 'Production designer for web series and ad films with a focus on period interiors.' }
    };
    return {
      meta,
      conn: { 'Kavya Menon': 'connected', 'Farhan Siddiqui': 'connected', 'Reelhouse Camera Rentals': 'connected', 'Arjun Kulkarni': 'connected', 'Ananya Iyer': 'connected',
        'Vikram Bhosle': 'received', 'Northlight Studios': 'received', 'Sana Mirza': 'pending', 'Kilowatt Lighting Co.': 'pending' },
      follow: { 'Meera Joshi': true, 'Kavya Menon': true, 'Reelhouse Camera Rentals': true, 'Northlight Studios': true, 'Kilowatt Lighting Co.': true },
      followers: { 'Meera Joshi': true, 'Kavya Menon': true, 'Vikram Bhosle': true, 'Ananya Iyer': true, 'Kilowatt Lighting Co.': true },
      plans: { seeker: 'free', poster: 'free', vendor: 'expiring' },
      notes: { 'Vikram Bhosle': 'We were both on the Pinewood TVC last month — would be good to stay connected for future shoots.' }
    };
  }
  componentWillUnmount() { if (this.screenEl) this.screenEl.removeEventListener('click', this.onClick, true); clearTimeout(this.rt); }

  // Find who a profile link refers to, from the tapped element and its row or card.
  personFrom(a) {
    const lab = a.getAttribute('aria-label') || '';
    if (/^Open /.test(lab)) return lab.slice(5);
    const own = a.querySelector('.t-h1, .t-h3');
    if (own) return own.textContent.trim();
    if (!a.children.length && a.textContent.trim()) return a.textContent.trim();
    const box = a.closest('.sheet, .li, .card');
    const el = box && box.querySelector('.t-h1, .t-h3, b');
    return el ? el.textContent.trim() : this.state.person;
  }

  onClick(e) {
    const path = e.composedPath ? e.composedPath() : [];
    let a = null;
    for (const n of path) { if (n === this.screenEl) break; if (n.tagName === 'A' && n.hasAttribute('href')) { a = n; break; } }
    if (!a) return;
    const href = a.getAttribute('href') || '';
    if (/^https?:/i.test(href)) return;
    e.preventDefault();
    const m = href.match(/([A-Za-z0-9_-]+)\.dc\.html/);
    if (!m) return;
    e.stopPropagation();
    const target = m[1];
    if (this.SCREENS.indexOf(target) < 0) return;
    const lab = (a.getAttribute('aria-label') || '').toLowerCase();
    const isBack = /^back/.test(lab) || lab === 'close';
    const inTabBar = !!a.closest('nav.nav');
    const extra = {};
    if (target === 'UserProfile') extra.person = this.personFrom(a);
    if (target === 'NoticeForm') extra.noticeMode = /edit/i.test(a.textContent) ? 'edit' : 'create';
    this.go(target, { isBack, inTabBar, extra });
  }

  go(target, o) {
    const s = this.state;
    const stack = s.stack.slice();
    const cur = stack[stack.length - 1];
    const patch = { ...(o && o.extra) };
    if (o && o.isBack && stack.length > 1) { stack.pop(); return this.setState({ ...patch, stack }); }
    if (target === 'Welcome') return this.setState({ ...patch, stack: ['Welcome'], role: 'guest' });
    if (this.HOMES[target]) {
      const i = stack.indexOf(target);
      return this.setState({ ...patch, role: this.HOMES[target], lastRole: this.HOMES[target], stack: i >= 0 ? stack.slice(0, i + 1) : [target] });
    }
    if (o && o.inTabBar) {
      const home = this.HOME_OF[s.role] || target;
      return this.setState({ ...patch, stack: target === home ? [home] : [home, target] });
    }
    if (cur === 'Splash') return this.setState({ ...patch, stack: [target] });
    if (target === cur) {
      this.setState({ ...patch, hide: target });
      clearTimeout(this.rt); this.rt = setTimeout(() => this.setState({ hide: null }), 30);
      return;
    }
    const i = stack.indexOf(target);
    this.setState({ ...patch, stack: i >= 0 ? stack.slice(0, i + 1) : [...stack, target] });
  }

  start(role, screens) { this.setState({ role, stack: screens, hide: null }); }

  renderVals() {
    const s = this.state;
    const cur = s.stack[s.stack.length - 1];
    const m = {}, d = {};
    this.SCREENS.forEach((k) => {
      m[k] = s.stack.indexOf(k) >= 0 && s.hide !== k;
      d[k] = 'position:absolute;inset:0;' + (k === cur ? 'display:block' : 'display:none');
    });
    const appRole = s.role === 'poster' ? 'poster' : s.role === 'vendor' ? 'vendor' : 'seeker';
    const pendingIn = Object.values(s.store.conn).filter((v) => v === 'received').length;
    return {
      m, d, store: s.store, act: this.act, person: s.person, screenRef: this.screenRef, noticeMode: s.noticeMode,
      appRole, isVendor: s.role === 'vendor',
      // Login (returning user) → last-used home; sign-up → role selection.
      otpNext: s.stack.indexOf('LogIn') >= 0 ? (this.HOME_OF[s.lastRole] || 'SeekerHome') : 'RoleSelect',
      plan: s.store.plans[appRole],
      roleLabel: { guest: 'Signed out', seeker: 'Job Seeker', poster: 'Job Poster', vendor: 'Vendor', association: 'Association' }[s.role],
      screenTitle: (this.TITLES[cur] || cur) + (cur === 'UserProfile' ? ' · ' + s.person : ''),
      trail: s.stack.map((k) => this.TITLES[k] || k).join('  ›  '),
      cantBack: s.stack.length < 2,
      pendingIn: pendingIn + ' new',
      back: () => { if (s.stack.length > 1) this.setState({ stack: s.stack.slice(0, -1) }); },
      goHome: () => this.setState({ stack: [this.HOME_OF[s.role] || 'Welcome'] }),
      startNew: () => this.start('guest', ['Splash']),
      startSeeker: () => this.start('seeker', ['SeekerHome']),
      startPoster: () => this.start('poster', ['PosterHome']),
      startVendor: () => this.start('vendor', ['VendorHome']),
      startAssoc: () => this.start('guest', ['Welcome', 'AssocLogin']),
      tryConnect: () => this.start('poster', ['PosterHome', 'Talent']),
      tryRequests: () => this.start('seeker', ['SeekerHome', 'Notifications']),
      tryForum: () => this.start('seeker', ['SeekerHome', 'ForumWall']),
      tryNotice: () => this.setState({ role: 'association', stack: ['AssocNotices'], noticeMode: 'create' }),
      reset: () => this.setState({ stack: ['Splash'], role: 'guest', person: 'Meera Joshi', hide: null, store: this.initialStore() })
    };
  }
}
</script>
