<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Applicants</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="./cc.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B2A8C}a:hover{color:#4A1F73}
</style>
</helmet>
<div class="ph">
  <div class="bar"><a class="iconbtn" href="Jobs.dc.html" aria-label="Back"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><div class="ttl">Applicants</div></div>
  <div style="flex: none; padding: 4px 20px 12px; display: flex; flex-direction: column; gap: 12px">
    <label class="lbl" for="job" style="margin-bottom: -6px">Job</label>
    <select id="job" class="inp" style="font-weight: 600" value="{{jobSel}}" onChange="{{onJob}}"><sc-for list="{{jobOpts}}" as="o" hint-placeholder-count="2"><option value="{{o.v}}">{{o.l}}</option></sc-for></select>
    <div class="chips x">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6"><button class="{{t.cls}}" onClick="{{t.pick}}" aria-pressed="{{t.on}}">{{t.label}}</button></sc-for>
    </div>
  </div>
  <div class="sc" style="padding-top: 0; gap: 12px">
    <div class="row t-s mut" role="status"><span class="sp"><b style="color: #1A1820">{{count}}</b> {{countWord}}</span><span class="t-c">Most recent first</span></div>
    <div class="list">
      <sc-for list="{{rows}}" as="a" hint-placeholder-count="6">
        <div class="li" style="flex-direction: column; align-items: stretch; gap: 10px; padding: 14px 16px; cursor: default">
          <a href="ApplicantDetail.dc.html" class="row" style="gap: 12px; align-items: flex-start; text-decoration: none; color: #1A1820">
            <div class="{{a.avCls}}" data-ini="{{a.ini}}">{{a.ini}}</div>
            <div class="sp" style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
              <div><div class="t-h3 trunc">{{a.name}}</div><div class="t-c b" style="color: #5B2A8C">{{a.titles}}</div><div class="t-c mut">{{a.band}} · {{a.yrs}} yrs · applied {{a.when}}</div></div>
              <div class="row" style="gap: 8px; flex-wrap: wrap"><sc-if value="{{a.hasAvail}}" hint-placeholder-val="{{ true }}"><span class="{{a.availCls}}">{{a.availText}}</span></sc-if><sc-if value="{{a.hasMut}}" hint-placeholder-val="{{ true }}"><span class="row" style="gap: 6px"><span class="mstack"><sc-for list="{{a.mutAv}}" as="mi" hint-placeholder-count="3"><span class="av xs" data-ini="{{mi}}">{{mi}}</span></sc-for></span><span class="t-c mut">{{a.mutText}}</span></span></sc-if></div>
            </div>
            <span class="{{a.badgeCls}}">
                <sc-if value="{{a.iApplied}}" hint-placeholder-val="{{ true }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-6 16-3-7z"></path></svg></sc-if>
                <sc-if value="{{a.iReview}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if>
                <sc-if value="{{a.iHold}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"></path></svg></sc-if>
                <sc-if value="{{a.iRej}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></sc-if>
                <sc-if value="{{a.iSel}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></sc-if>
                {{a.status}}
              </span>
          </a>
          <sc-if value="{{a.canAct}}" hint-placeholder-val="{{ true }}"><div class="row" style="gap: 8px; padding-left: 56px"><button class="btn btn-s btn-sm" style="flex: 1; color: #2C6619" onClick="{{a.shortlist}}">Shortlist</button><button class="btn btn-s btn-sm" style="flex: 1; color: #B42318" onClick="{{a.reject}}">Reject</button><a class="btn btn-t btn-sm" href="ApplicantDetail.dc.html">Profile</a></div></sc-if>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div class="empty"><div class="ring"><svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path></svg></div><sc-if value="{{noneYet}}" hint-placeholder-val="{{ false }}"><div class="t-h3">No applicants yet</div></sc-if><sc-if value="{{someYet}}" hint-placeholder-val="{{ true }}"><div class="t-h3">No applicants with this status</div></sc-if><sc-if value="{{someYet}}" hint-placeholder-val="{{ true }}"><button class="btn btn-s btn-sm" onClick="{{showAll}}">Show all applicants</button></sc-if></div>
    </sc-if>
  </div>

  <sc-if value="{{toast}}" hint-placeholder-val="{{ false }}"><div class="toast" role="status">{{toastText}}</div></sc-if>
  <nav class="nav" aria-label="Main">
    <a href="SeekerHome.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path></svg></span>Home</a>
    <a class="on" href="Jobs.dc.html" aria-current="page"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"></path></svg></span>Jobs</a>
    <a class="post" href="CreateJob.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.4"><path d="M12 5v14M5 12h14"></path></svg></span>Post a job</a>
    <a href="Calendar.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg></span>Calendar</a>
    <a href="SeekerProfile.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"job":{"editor":"text"},"store":{"editor":null},"act":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  net(n) {
    const N = { 'Meera Joshi': [12, 'av'], 'Arjun Kulkarni': [4, 'tb'], 'Sana Mirza': [7, 'av'], 'Farhan Siddiqui': [9, 'un'], 'Ananya Iyer': [3, 'av'], 'Vikram Bhosle': [15, 'tb'], 'Kavya Menon': [18, ''], 'Northlight Studios': [6, ''], 'Reelhouse Camera Rentals': [11, ''], 'Kilowatt Lighting Co.': [2, ''], 'Nisha Verma': [5, 'av'], 'Aditya Rao': [8, 'av'], 'Priya Nair': [10, 'av'], 'Rohan D’Souza': [1, 'un'], 'Karthik Subramanian': [0, 'av'], 'Imran Shaikh': [2, 'av'] };
    const pool = ['FS', 'AI', 'MJ', 'VB', 'AK', 'SM', 'KM', 'NV'];
    const e = N[n] || [0, ''];
    const me = n.split(' ').map((x) => x[0]).join('').slice(0, 2);
    const m = e[0];
    const AV = { av: ['Available', 'avail a-av'], un: ['Unavailable', 'avail a-un'], tb: ['Tentatively booked', 'avail a-tb'] };
    return {
      isHiring: ['Kavya Menon', 'Vikram Bhosle', 'Nisha Verma'].indexOf(n) >= 0,
      mutN: m, hasMut: m > 0, noMut: m === 0,
      mutText: m === 0 ? 'No mutual connections' : m + (m === 1 ? ' mutual connection' : ' mutual connections'),
      mutAv: pool.filter((x) => x !== me).slice(0, Math.min(3, m)),
      hasAvail: !!e[1], availText: e[1] ? AV[e[1]][0] : '', availCls: e[1] ? AV[e[1]][1] : ''
    };
  }
  constructor(p) {
    super(p);
    this.data = [
      { name: 'Aditya Rao', titles: '2nd Assistant Camera · Focus Puller', role: 'Focus Puller', band: 'Senior', yrs: 11, status: 'Applied', when: '2h ago' },
      { name: 'Nisha Verma', titles: '2nd Assistant Camera', role: '2nd Assistant Camera', band: 'Mid-Level', yrs: 6, status: 'Under Review', when: 'Yesterday' },
      { name: 'Farhan Siddiqui', titles: '1st Assistant Camera · Focus Puller', role: '1st Assistant Camera', band: 'Mid-Level', yrs: 5, status: 'Under Review', when: 'Yesterday' },
      { name: 'Meera Joshi', titles: 'Focus Puller · 1st Assistant Camera', role: 'Focus Puller', band: 'Senior', yrs: 14, status: 'Selected', when: '2d ago' },
      { name: 'Rohan D’Souza', titles: '2nd Assistant Camera', role: '2nd Assistant Camera', band: 'Junior', yrs: 2, status: 'On Hold', when: '2d ago' },
      { name: 'Karthik Subramanian', titles: 'Camera Trainee', role: 'Camera Technician', band: 'Junior', yrs: 1, status: 'Rejected', when: '3d ago' },
      { name: 'Sana Mirza', titles: '2nd Assistant Camera', role: 'Focus Puller', band: 'Mid-Level', yrs: 7, status: 'Applied', when: '3d ago' },
      { job: 'p2', name: 'Vivek Nair', titles: '1st Assistant Camera · Focus Puller', role: '1st Assistant Camera', band: 'Mid-Level', yrs: 5, status: 'Applied', when: '1d ago' },
      { job: 'p2', name: 'Ishita Rao', titles: '1st Assistant Camera', role: '1st Assistant Camera', band: 'Junior', yrs: 3, status: 'Under Review', when: '4d ago' }
    ];
    this.state = { tab: 'All', st: {}, toast: '' };
  }
  flash(m) { this.setState({ toast: m }); clearTimeout(this.t); this.t = setTimeout(() => this.setState({ toast: '' }), 2400); }
  renderVals() {
    const s = this.state;
    const tabs = ['All', 'Applied', 'Under Review', 'Shortlisted', 'On Hold', 'Selected', 'Rejected'];
    const jobSel = this.state.jobSel || this.props.job || 'p1';
    const mine = this.data.filter((a) => (a.job || 'p1') === jobSel);
    const cnt = (t) => { const d = mine.map((a) => ({ ...a, status: this.state.st[a.name] || a.status })); return t === 'All' ? d.length : d.filter((a) => a.status === t).length; };
    const bc = { 'Shortlisted': 'badge b-g', 'Applied': 'badge b-n', 'Under Review': 'badge b-p', 'On Hold': 'badge b-w', 'Rejected': 'badge b-e', 'Selected': 'badge b-g' };
    const data = mine.map((a) => ({ ...a, status: this.state.st[a.name] || a.status }));
    const list = data.filter((a) => s.tab === 'All' || a.status === s.tab);
    const c = (this.props.store && this.props.store.crew) || { posts: [] };
    const ps = c.posts.filter((p) => p.st === 'Active' || p.st === 'Closed');
    return {
      jobOpts: ps.map((p) => ({ v: p.id, l: p.title + ' · ' + p.apps })), jobSel, onJob: (e) => this.setState({ jobSel: e.target.value, tab: 'All' }), noneYet: mine.length === 0, someYet: mine.length > 0,
      toast: !!this.state.toast, toastText: this.state.toast,
      tabs: tabs.map((t) => ({ label: t + ' · ' + cnt(t), on: s.tab === t, cls: s.tab === t ? 'chip on' : 'chip', pick: () => this.setState({ tab: t }) })),
      rows: list.map((a, i) => ({
        ...a, ...this.net(a.name), ini: a.name.split(' ').map((x) => x[0]).join('').slice(0, 2),
        canAct: a.status === 'Applied' || a.status === 'Under Review',
        shortlist: () => { this.setState({ st: { ...this.state.st, [a.name]: 'Shortlisted' } }); this.flash(a.name + ' shortlisted · they’ll be notified'); },
        reject: () => { this.setState({ st: { ...this.state.st, [a.name]: 'Rejected' } }); this.flash(a.name + ' rejected'); },
        avCls: i % 2 ? 'av g' : 'av', badgeCls: bc[a.status],
        iApplied: a.status === 'Applied', iReview: a.status === 'Under Review', iHold: a.status === 'On Hold', iRej: a.status === 'Rejected', iSel: a.status === 'Selected'
      })),
      count: list.length, countWord: list.length === 1 ? 'applicant' : 'applicants', empty: list.length === 0,
      showAll: () => this.setState({ tab: 'All' })
    };
  }
}
</script>
</body>
</html>
