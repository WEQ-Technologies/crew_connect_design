<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Applicants</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="./cc.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B2A8C}a:hover{color:#4A1F73}
</style>
</helmet>
<div class="ph">
  <div class="bar"><div class="ttl" style="padding-left: 12px; font-size: 20px">Applicants</div></div>
  <div style="flex: none; padding: 4px 20px 12px; display: flex; flex-direction: column; gap: 12px">
    <label class="lbl" for="job" style="margin-bottom: -6px">Job</label>
    <select id="job" class="inp" style="font-weight: 700"><option>Focus Puller — Feature Film (Hindi) · 18</option><option>Production Designer — Period Drama Pilot · 9</option><option>Spot Boy / Set Assistant · 0</option></select>
    <div class="chips x">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6"><button class="{{t.cls}}" onClick="{{t.pick}}" aria-pressed="{{t.on}}">{{t.label}}</button></sc-for>
    </div>
  </div>
  <div class="sc" style="padding-top: 0; gap: 12px">
    <div class="row t-s mut" role="status"><span class="sp"><b style="color: #1D1B22">{{count}}</b> {{countWord}}</span><span class="t-c">Most recent first</span></div>
    <div class="list">
      <sc-for list="{{rows}}" as="a" hint-placeholder-count="6">
        <a class="li" href="ApplicantDetail.dc.html" style="align-items: flex-start; padding: 14px 16px">
          <div class="{{a.avCls}}">{{a.ini}}</div>
          <div class="sp" style="display: flex; flex-direction: column; gap: 6px">
            <div><div class="t-h3 trunc">{{a.name}}</div><div class="t-c mut">{{a.role}} · {{a.band}} · {{a.yrs}} yrs</div></div>
            <div class="row" style="gap: 8px">
              <span class="{{a.badgeCls}}">
                <sc-if value="{{a.iApplied}}" hint-placeholder-val="{{ true }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-6 16-3-7z"></path></svg></sc-if>
                <sc-if value="{{a.iReview}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if>
                <sc-if value="{{a.iHold}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"></path></svg></sc-if>
                <sc-if value="{{a.iRej}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></sc-if>
                <sc-if value="{{a.iSel}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></sc-if>
                {{a.status}}
              </span>
              <span class="t-c mut">{{a.when}}</span>
            </div>
          </div>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #6E6876; margin-top: 10px"><path d="m9 18 6-6-6-6"></path></svg>
        </a>
      </sc-for>
    </div>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div class="empty"><div class="ring"><svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path></svg></div><div class="t-h3">No applicants with this status</div><button class="btn btn-s btn-sm" onClick="{{showAll}}">Show all applicants</button></div>
    </sc-if>
  </div>

  <nav class="nav" aria-label="Main">
    <a href="PosterHome.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path></svg></span>Home</a>
    <a href="MyJobs.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"></path></svg></span>My Jobs</a>
    <a class="on" href="Applicants.dc.html" aria-current="page"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"></path></svg></span>Applicants</a>
    <a href="Talent.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></span>Find Talent</a>
    <a href="PosterProfile.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1"></rect><path d="M9 7h1M14 7h1M9 11h1M14 11h1M10 21v-3h4v3"></path></svg></span>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.data = [
      { name: 'Aditya Rao', role: 'Focus Puller', band: 'Senior', yrs: 11, status: 'Applied', when: '2h ago' },
      { name: 'Priya Nair', role: 'Focus Puller', band: 'Mid-Level', yrs: 6, status: 'Under Review', when: 'Yesterday' },
      { name: 'Farhan Siddiqui', role: '1st Assistant Camera', band: 'Mid-Level', yrs: 5, status: 'Under Review', when: 'Yesterday' },
      { name: 'Meera Joshi', role: 'Focus Puller', band: 'Senior', yrs: 14, status: 'Selected', when: '2d ago' },
      { name: 'Rohan D’Souza', role: '2nd Assistant Camera', band: 'Junior', yrs: 2, status: 'On Hold', when: '2d ago' },
      { name: 'Karthik Subramanian', role: 'Camera Technician', band: 'Junior', yrs: 1, status: 'Rejected', when: '3d ago' },
      { name: 'Nisha Verma', role: 'Focus Puller', band: 'Mid-Level', yrs: 7, status: 'Applied', when: '3d ago' }
    ];
    this.state = { tab: 'All' };
  }
  renderVals() {
    const s = this.state;
    const tabs = ['All', 'Applied', 'Under Review', 'On Hold', 'Selected', 'Rejected'];
    const cnt = (t) => (t === 'All' ? this.data.length : this.data.filter((a) => a.status === t).length);
    const bc = { 'Applied': 'badge b-n', 'Under Review': 'badge b-p', 'On Hold': 'badge b-w', 'Rejected': 'badge b-e', 'Selected': 'badge b-g' };
    const list = this.data.filter((a) => s.tab === 'All' || a.status === s.tab);
    return {
      tabs: tabs.map((t) => ({ label: t + ' · ' + cnt(t), on: s.tab === t, cls: s.tab === t ? 'chip on' : 'chip', pick: () => this.setState({ tab: t }) })),
      rows: list.map((a, i) => ({
        ...a, ini: a.name.split(' ').map((x) => x[0]).join('').slice(0, 2),
        avCls: i % 2 ? 'av g' : 'av', badgeCls: bc[a.status],
        iApplied: a.status === 'Applied', iReview: a.status === 'Under Review', iHold: a.status === 'On Hold', iRej: a.status === 'Rejected', iSel: a.status === 'Selected'
      })),
      count: list.length, countWord: list.length === 1 ? 'applicant' : 'applicants', empty: list.length === 0,
      showAll: () => this.setState({ tab: 'All' })
    };
  }
}
</script>
</body>
</html>
