<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>As Crew, what will you do?</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./cc.css">
</head>
<body>
<x-dc>
<helmet>
<link href="./fonts/fonts.css" rel="stylesheet">
<style>
body{margin:0}
a{color:#7C3AED}a:hover{color:#6527C8}
.rc-card{display:flex;align-items:center;gap:14px;padding:16px;width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:18px;
  background:linear-gradient(160deg,rgba(255,255,255,.82),rgba(255,255,255,.5));border:2px solid rgba(255,255,255,.9);
  box-shadow:0 12px 28px -14px rgba(24,44,30,.22),inset 0 1px 0 #fff;-webkit-backdrop-filter:blur(18px) saturate(165%);backdrop-filter:blur(18px) saturate(165%);
  transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease,background-color .18s ease}
@media (hover:hover){.rc-card:hover{border-color:rgba(183,154,214,.75);transform:translateY(-1px);box-shadow:0 0 0 3px rgba(183,154,214,.18),0 14px 30px -14px rgba(101,39,200,.35),inset 0 1px 0 #fff}}
.rc-card:active{transform:scale(.99)}
.rc-card:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(183,154,214,.7)}
.rc-card.on{border-color:#7C3AED;background-color:rgba(246,243,255,.9)}
.rc-st{opacity:0;transform:translateY(12px);animation:rcin .5s cubic-bezier(.22,.8,.2,1) forwards}
@keyframes rcin{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rc-st{animation:none;opacity:1;transform:none}.rc-card{transition:none}}
</style>
</helmet>
<div class="ph bg-alt">
  <div class="bar"><a class="iconbtn" href="RoleChoice.dc.html" aria-label="{{cct.common.back}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><div class="ttl"></div><span class="t-s mut b" style="padding-right: 12px">{{cct.mode_choice.crew_1_more_question}}</span></div>
  <div class="sc" style="padding-top: 8px; gap: 22px">
    <div class="rc-st" style="display: flex; flex-direction: column; gap: 10px">
      <div class="badge b-p" style="align-self: flex-start">{{cct.common.crew}}</div>
      <h1 class="t-d">{{cct.common.as_crew_what_will_you}}</h1>
      <p class="t-b mut">{{cct.mode_choice.jobs_shows_only_what_you}}</p>
    </div>

    <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 12px" aria-busy="true" aria-label="{{cct.common.loading_options}}">
        <div class="card" style="flex-direction: row; gap: 14px; align-items: center"><div class="skel" style="width: 48px; height: 48px; border-radius: 14px"></div><div class="sp" style="display: flex; flex-direction: column; gap: 8px"><div class="skel" style="height: 14px; width: 50%"></div><div class="skel" style="height: 12px; width: 80%"></div></div></div>
        <div class="card" style="flex-direction: row; gap: 14px; align-items: center"><div class="skel" style="width: 48px; height: 48px; border-radius: 14px"></div><div class="sp" style="display: flex; flex-direction: column; gap: 8px"><div class="skel" style="height: 14px; width: 45%"></div><div class="skel" style="height: 12px; width: 75%"></div></div></div>
        <div class="card" style="flex-direction: row; gap: 14px; align-items: center"><div class="skel" style="width: 48px; height: 48px; border-radius: 14px"></div><div class="sp" style="display: flex; flex-direction: column; gap: 8px"><div class="skel" style="height: 14px; width: 30%"></div><div class="skel" style="height: 12px; width: 70%"></div></div></div>
      </div>
    </sc-if>

    <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
      <div role="radiogroup" aria-label="{{cct.mode_choice.what_you_will_do_as}}" style="display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
          <button class="{{o.cls}}" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="{{o.anim}}">
            <span class="{{o.sq}}" style="width: 48px; height: 48px; border-radius: 14px">
              <sc-if value="{{o.isCrew}}" hint-placeholder-val="{{ true }}"><svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></sc-if>
              <sc-if value="{{o.isVen}}" hint-placeholder-val="{{ false }}"><svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M19 8v6M16 11h6"></path></svg></sc-if>
              <sc-if value="{{o.isBoth}}" hint-placeholder-val="{{ false }}"><svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="11" height="10" rx="2"></rect><path d="M10 9V7.5a2 2 0 0 1 2-2h1"></path><path d="M14 6.5 18.5 4.5 23 6.5v6L18.5 15"></path></svg></sc-if>
            </span>
            <span class="sp" style="display: flex; flex-direction: column; gap: 3px">
              <span class="t-h3" style="font-size: 16px">{{o.title}}</span>
              <span class="t-s mut">{{o.desc}}</span>
            </span>
            <span class="{{o.radio}}"></span>
          </button>
        </sc-for>
        <sc-if value="{{err}}" hint-placeholder-val="{{ false }}"><span class="errt" role="alert"><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.01"></path></svg>{{cct.mode_choice.pick_one_to_continue}}</span></sc-if>
      </div>
    </sc-if>
  </div>
  <div class="foot">
    <sc-if value="{{valid}}" hint-placeholder-val="{{ false }}"><a class="btn btn-p w100" href="SetupBasic.dc.html">{{cct.common.continue}}</a></sc-if>
    <sc-if value="{{invalid}}" hint-placeholder-val="{{ true }}"><button class="btn btn-p w100" disabled="" aria-disabled="true">{{cct.common.continue}}</button></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"act":{"editor":null},"demo":{"editor":"enum","options":["","loading","error","seek","post","both"],"default":""},"$preview":{"width":390,"height":844}}'>

</body>
</html>
